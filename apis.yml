aid: newsapi
name: NewsAPI
description: >
  NewsAPI is a simple, easy-to-use REST API that returns JSON metadata for news
  articles and breaking headlines published by over 80,000 worldwide sources
  and blogs. The API supports full-text keyword search across hundreds of
  millions of articles, filtering by source domain, language, date range, and
  sorting by relevance or publication date. A dedicated top-headlines endpoint
  delivers live breaking news by country and category — covering business,
  entertainment, general, health, science, sports, and technology. Developers
  authenticate via an API key passed as a query parameter or HTTP header, and
  all responses are returned as standard JSON.
